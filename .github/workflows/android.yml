name: Android APK
on:
  push:
    branches: [main, feat/p0]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run android:sync
      - name: Check bundled offline assets
        run: |
          test -f dist-android/fonts/NotoSans.ttf
          test ! -f dist-android/sw.js
          test ! -f dist-android/manifest.webmanifest
          test -n "$(find dist-android/assets -name 'packing.worker-*.js')"
          test -n "$(find dist-android/assets -name 'import.worker-*.js')"
          node -e 'const c=require("./android/app/src/main/assets/capacitor.config.json"); if(c.server?.url) process.exit(1)'
      - name: Assemble installable APK and instrumentation
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Verify APK signing and record build information
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/vlezet-preview.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs artifacts/vlezet-preview.apk > artifacts/signature.txt
          "$build_tools/aapt" dump badging artifacts/vlezet-preview.apk > artifacts/manifest.txt
          (cd artifacts && sha256sum vlezet-preview.apk > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nPackage: app.vlezet.preview\nBuild: debug preview, not a store release\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > artifacts/build-info.txt
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test offline on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon --max-workers=2
            adb pull /sdcard/vlezet-smoke.png artifacts/android-smoke.png
            node -e 'const b=require("node:fs").readFileSync("artifacts/android-smoke.png"); if(b.subarray(0,8).toString("hex")!=="89504e470d0a1a0a") throw new Error("Invalid screenshot")'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: vlezet-android-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vlezet-android-${{ github.run_number }}
          path: artifacts
      - name: Remove the former private-repository signing cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --key android-preview-debug-key-v1 --limit 100 --json id,key \
            --jq '.[] | select(.key == "android-preview-debug-key-v1") | .id' > /tmp/vlezet-signing-cache-ids
          while read -r cache_id; do
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done < /tmp/vlezet-signing-cache-ids
      - name: Publish versioned Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check SHA256SUMS)
          version="0.1.${GITHUB_RUN_NUMBER}"
          grep -F "versionName='$version'" artifacts/manifest.txt
          grep -Fx "Commit: $GITHUB_SHA" artifacts/build-info.txt
          test -s artifacts/android-smoke.png
          apk="vlezet-${version}-android.apk"
          mv artifacts/vlezet-preview.apk "artifacts/$apk"
          (cd artifacts && sha256sum "$apk" > SHA256SUMS)
          export VLEZET_VERSION="$version"
          envsubst '${VLEZET_VERSION}' < .github/release-notes.md > /tmp/vlezet-release-notes.md
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Влезет $version для Android" --prerelease \
            --notes-file /tmp/vlezet-release-notes.md \
            "artifacts/$apk" artifacts/SHA256SUMS artifacts/android-smoke.png \
            artifacts/build-info.txt artifacts/manifest.txt artifacts/signature.txt
